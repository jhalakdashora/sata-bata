name: split_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_mlkit_text_recognition: ^1.0.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  meta: ^1.19.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

# Launcher icons. Regenerate after changing tool/icon/render_icon_test.dart:
#   flutter test tool/icon/render_icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: launcher_icon
  adaptive_icon_background: "#0E7C66"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
